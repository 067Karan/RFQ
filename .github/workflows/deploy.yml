
name: Deploy RFQ to AWS EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy Application
    runs-on: ubuntu-latest

    steps:
      - name: Connect to EC2 and deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          command_timeout: 20m
          script: |
            set -e

            echo "Starting RFQ deployment..."

            cd /home/ubuntu/RFQ

            echo "Pulling latest code..."
            git fetch origin main
            git reset --hard origin/main

            echo "Building frontend..."
            cd /home/ubuntu/RFQ/RFQ_System-main/frontend
            npm ci
            npm run build

            echo "Updating frontend files..."
            sudo mkdir -p /var/www/rfq
            sudo rsync -a --delete dist/ /var/www/rfq/

            echo "Building backend Docker image..."
            cd /home/ubuntu/RFQ/RFQ_System-main/backend
            docker build -t rfq-backend .

            echo "Replacing backend container..."
            docker rm -f rfq-backend || true

            docker run -d \
              --name rfq-backend \
              --restart unless-stopped \
              --env-file .env \
              -p 5000:5000 \
              rfq-backend

            echo "Checking backend health..."
            for i in $(seq 1 20); do
              if curl -fsS http://localhost:5000/health >/dev/null; then
                echo "Backend is healthy!"
                exit 0
              fi
              sleep 3
            done

            echo "Backend health check failed!"
            docker logs --tail 80 rfq-backend
            exit 1
